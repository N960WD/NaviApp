# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
name: NaviApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NaviCore:
    path: NaviCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NaviApp:
    type: application
    platform: iOS
    sources:
      - NaviApp
    dependencies:
      - package: NaviCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.naviapp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: YOURTEAMID
    entitlements:
      path: NaviApp/Resources/NaviApp.entitlements
      properties:
        # Requires Apple approval for on-device use; works in the CarPlay Simulator as-is.
        com.apple.developer.carplay-driving-task: true
    info:
      path: NaviApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Route Timer
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: Route Timer uses your location to measure speed and progress along the route and to compute arrival times.
        NSLocationAlwaysAndWhenInUseUsageDescription: Route Timer keeps tracking your progress while the phone is locked or CarPlay is in the foreground.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate

schemes:
  NaviApp:
    build:
      targets:
        NaviApp: all
