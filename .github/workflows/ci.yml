name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core unit tests
        working-directory: NaviCore
        run: swift test

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build app (iOS Simulator)
        run: |
          xcodebuild build \
            -project NaviApp.xcodeproj \
            -scheme NaviApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
